<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feihao Ye — Architecture Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #eeeeee;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 56px;
      padding: 0 22px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .button {
      padding: 9px 15px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .button:hover {
      background: #333333;
    }

    .viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
      background: #eeeeee;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 14px;
      }

      .name {
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .button {
        padding: 8px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="name">
      FEIHAO YE — ARCHITECTURE PORTFOLIO
    </div>

    <a
      class="button"
      href="./Feihao%20Ye_Portfolio_2026.pdf"
      target="_blank"
      rel="noopener"
    >
      Open / Download PDF
    </a>
  </header>

  <iframe
    class="viewer"
    src="./Feihao%20Ye_Portfolio_2026.pdf#view=FitH"
    title="Feihao Ye Architecture Portfolio"
  ></iframe>

</body>
</html>
