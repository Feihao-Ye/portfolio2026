<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feihao — Architecture Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    header {
      height: 56px;
      padding: 0 24px;
      background: #ffffff;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .button {
      padding: 9px 15px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      border-radius: 3px;
    }

    .viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 56px);
      border: none;
    }

    .fallback {
      padding: 48px 24px;
      text-align: center;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <header>
    <div class="name">FEIHAO — ARCHITECTURE PORTFOLIO</div>

    <a
      class="button"
      href="Feihao Ye_Portfolio_2026.pdf"
      target="_blank"
    >
      Open / Download PDF
    </a>
  </header>

  <object
    class="viewer"
    data="Feihao_Portfolio_2026.pdf#view=FitH"
    type="application/pdf"
  >
    <div class="fallback">
      <p>Your browser cannot display the embedded PDF.</p>

      <a href="Feihao Ye_Portfolio_2026.pdf">
        Open the portfolio PDF
      </a>
    </div>
  </object>

</body>
</html>
